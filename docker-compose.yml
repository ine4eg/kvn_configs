services:
  vpn-runner:
    build: .
    container_name: vpn-runner
    restart: unless-stopped
    # API port + Bridge Shadowsocks port + upstream SOCKS ports
    ports:
      - "29000:29000"   # API
      - "8443:8443"     # Bridge Shadowsocks
      - "11080:11080"   # Upstream SOCKS 0
      - "11081:11081"   # Upstream SOCKS 1
      - "11082:11082"   # Upstream SOCKS 2
    volumes:
      - ./data:/data
    environment:
      CONFIG_URL: "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt"
      XRAY_BIN: "xray"
      RUN_INTERVAL: "3600"
      OUTPUT_DIR: "/data"
      API_PORT: "29000"
    security_opt:
      - no-new-privileges:false
    cap_add:
      - NET_ADMIN
    networks:
      - vpn-network

networks:
  vpn-network:
    driver: bridge
